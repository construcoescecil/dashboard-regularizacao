name: Atualizar dados do dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Atualizar a cópia da planilha
        run: node scripts/atualizar-dados.mjs

      - name: Publicar somente quando houver alteração
        shell: bash
        run: |
          if git diff --quiet -- dados.json; then
            echo "Sem alterações na base."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json
          git commit -m "Atualiza dados do dashboard"
          git push
