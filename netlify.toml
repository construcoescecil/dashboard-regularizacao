[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  included_files = ["dados.json"]

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
